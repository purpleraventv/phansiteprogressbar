<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&display=swap" rel="stylesheet">   
   
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phan-Site - 4/15 Poll</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Arsenal", Arial, Helvetica, sans-serif;

        background:
            linear-gradient(
                135deg,
                #64121e 0%,
                #9e2531 45%,
                #df704e 100%
            );
    }

    /* =====================================
       MAIN PHAN-SITE PANEL
    ===================================== */

    .phansite {
        position: relative;

        width: min(800px, 82vw);
        min-height: 280px;

        padding: 35px 35px 25px 100px;

        background: #050505;

        color: white;

        transform: rotate(-1.5deg);

        box-shadow:
            14px 14px 0 rgba(0, 0, 0, 0.28);

        z-index: 1;
    }

    .phansite::after {
        content: "";

        position: absolute;

        left: 28px;
        right: -28px;
        bottom: -22px;

        height: 30px;

        background: #050505;

        clip-path: polygon(
            0 0,
            96% 0,
            100% 100%,
            4% 100%
        );

        z-index: -1;
    }


    /* =====================================
       GIANT Q
    ===================================== */

    .q {
        position: absolute;

        left: 8px;
        top: 3px;

        font-size: 125px;
        line-height: 1;

        font-weight: 1000;

        color: white;

        transform: rotate(3deg);

        z-index: 5;
    }


    /* =====================================
       PHAN-SITE TITLE
    ===================================== */

    .title {
        position: relative;

        display: inline-block;

        padding: 2px 8px 3px;

        background: #050505;

        border: 5px solid white;

        color: white;

        font-size: 40px;
        font-weight: 1000;

        line-height: 1;

        letter-spacing: -3px;

        transform: rotate(-7deg);

        z-index: 4;
    }

    .title::before {
        content: "";

        position: absolute;

        left: 47%;
        top: -60px;

        width: 48px;
        height: 72px;

        background: white;

        clip-path: polygon(
            48% 0,
            100% 0,
            65% 36%,
            100% 36%,
            18% 100%,
            39% 53%,
            0 53%
        );

        z-index: -1;
    }


    /* =====================================
       QUESTION
    ===================================== */

    .question {
        margin-top: 15px;
        margin-left: 45px;

        font-size: 23px;
        font-weight: 900;

        line-height: 1.1;

        transform: rotate(-1.5deg);
    }

    .red {
        color: #ff1010;
    }


    /* =====================================
       POLL RESULT
    ===================================== */

    .result {
        display: flex;
        align-items: center;

        gap: 20px;

        margin-top: 25px;

        transform: rotate(-0.7deg);
    }


    /* =====================================
       FULL 100% POLL BAR
    ===================================== */

    .bar-container {
        position: relative;

        flex: 1;

        height: 50px;

        padding: 6px;

        background: white;

        clip-path: polygon(
            0 10%,
            100% 0,
            98% 100%,
            0 91%
        );
    }

    /*
        This is a FULL 100% bar.

        If the result is 5%,
        the red section is 5% of the
        entire bar — NOT 50%.
    */

    .bar {
        width: 5%;

        height: 100%;

        background: #ff0505;

        transition:
            width 0.25s cubic-bezier(.2,.8,.3,1);
    }


    /* =====================================
       YES LABEL
    ===================================== */

    .yes {
        position: absolute;

        right: -43px;
        bottom: -15px;

        font-size: 22px;
        font-weight: 1000;

        color: white;

        transform: rotate(-2deg);
    }


    /* =====================================
       PERCENTAGE
    ===================================== */

    .percentage {
        width: 175px;

        font-size: 65px;

        line-height: 0.8;

        font-weight: 1000;

        color: #ff0808;

        letter-spacing: -5px;

        white-space: nowrap;

        text-shadow:
            4px 4px 0 #000;

        transition:
            transform 0.12s ease-out;
    }

    .percentage.bump {
        transform:
            scale(1.035)
            rotate(-1deg);
    }


    /* =====================================
       COMMENT AREA
    ===================================== */

    .comment-container {
        position: relative;

        height: 40px;

        margin-top: 25px;
        margin-left: -8px;

        overflow: hidden;
    }

    .comment {
        position: absolute;

        left: 0;
        top: 0;

        width: 100%;

        font-size: 20px;
        font-weight: 900;

        line-height: 35px;

        white-space: nowrap;

        transform: translateY(0);

        opacity: 1;
    }


    /* =====================================
       COMMENT EXIT
    ===================================== */

    .comment.exit {
        animation:
            commentExit 0.28s ease-in forwards;
    }

    @keyframes commentExit {

        0% {
            transform: translateY(0);
            opacity: 1;
        }

        100% {
            transform: translateY(-40px);
            opacity: 0;
        }

    }


    /* =====================================
       COMMENT ENTER
    ===================================== */

    .comment.enter {
        animation:
            commentEnter 0.28s ease-out forwards;
    }

    @keyframes commentEnter {

        0% {
            transform: translateY(40px);
            opacity: 0;
        }

        100% {
            transform: translateY(0);
            opacity: 1;
        }

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 800px) {

        .phansite {
            width: 92vw;

            padding:
                30px
                25px
                20px
                85px;
        }

        .q {
            font-size: 105px;
        }

        .title {
            font-size: 34px;
        }

        .question {
            margin-left: 30px;
            font-size: 20px;
        }

        .percentage {
            width: 150px;
            font-size: 55px;
        }

        .yes {
            font-size: 19px;
        }

        .comment {
            font-size: 17px;
        }
    }

</style>
</head>


<body>

<div class="phansite">

    <!-- Giant Q -->
    <div class="q">Q</div>


    <!-- PHAN-SITE -->
    <div class="title">
        Phan-Site
    </div>


    <!-- QUESTION -->
    <div class="question">
        Do you believe in the
        <span class="red">Phantom Thieves</span>?
    </div>


    <!-- POLL -->
    <div class="result">

        <div class="bar-container">

            <div
                class="bar"
                id="bar">
            </div>

            <div class="yes">
                YES
            </div>

        </div>


        <div
            class="percentage"
            id="percentage">
            5.0%
        </div>

    </div>


    <!-- COMMENT -->
    <div class="comment-container">

        <div
            class="comment enter"
            id="comment">
        </div>

    </div>

</div>


<script>

/* =========================================
   POLL DATA
========================================= */

const pollData = {

    /*
        The poll fluctuates between 0% and 10%
        of the complete 100% poll.
    */

    percentageMin: 0,
    percentageMax: 10,

    comments: [

        "Anon: Admin has to be trolling",

        "Anon: can you prove they're fake?",

        "Anon: damn that's good lol",

        "Anon: even kids aren't that dumb",

        "Anon: gtfo with that shit LOL",

        "Anon: I've been waiting for this!",

        "Anon: I searched... makes no sense",

        "Anon: Isn't it just a prank?",

        "Anon: If so, I wanna meet 'em!",

        "Anon: Is this some kind of cult?",

        "Anon: It's possible.",

        "Anon: Kinda...",

        "Anon: laaame roflmao",

        "Anon: Never even heard of them",

        "Anon: not even worth a laugh",

        "Anon: 'of hearts'? what tryhards",

        "Anon: ok but are they hot?",

        "Anon: phantom thieves LOL",

        "Anon: played too many games",

        "Anon: prolly some publicity stunt",

        "Anon: sauce plz",

        "Anon: Save me first!",

        "Anon: sounds stupid, but yes",

        "Anon: these pranks are the best",

        "Anon: thief! give it back! lol",

        "Anon: Thieves should be arrested!",

        "Anon: try and steal it, asshats",

        "Anon: ugh quit with the rumors",

        "Anon: viral marketing...?",

        "Anon: What a fun idea XD",

        "Anon: Who's spreading this?",

        "Anon: Who made this site? Ridic",

        "Anon: ya rite lol"

    ]

};


/* =========================================
   ELEMENTS
========================================= */

const commentElement =
    document.getElementById("comment");

const percentageElement =
    document.getElementById("percentage");

const barElement =
    document.getElementById("bar");


/* =========================================
   COMMENT STATE
========================================= */

let currentComment = -1;


/* =========================================
   GET RANDOM COMMENT
========================================= */

function getRandomComment() {

    let nextComment;

    do {

        nextComment =
            Math.floor(
                Math.random() *
                pollData.comments.length
            );

    } while (
        nextComment === currentComment &&
        pollData.comments.length > 1
    );

    currentComment = nextComment;

    return pollData.comments[nextComment];
}


/* =========================================
   CHANGE COMMENT
========================================= */

function changeComment() {

    commentElement.classList.remove("enter");

    commentElement.classList.add("exit");


    setTimeout(() => {

        commentElement.textContent =
            getRandomComment();

        commentElement.classList.remove("exit");

        void commentElement.offsetWidth;

        commentElement.classList.add("enter");

    }, 280);
}


/* =========================================
   UPDATE PERCENTAGE
========================================= */

function updatePercentage() {

    /*
        Pick a value from 0.0% to 10.0%.

        This value is already a percentage
        of the FULL 100% bar.

        Example:

        2.5% = 2.5% of the bar
        5.0% = 5.0% of the bar
        7.5% = 7.5% of the bar
        10.0% = 10.0% of the bar
    */

    const randomValue =
        pollData.percentageMin +
        Math.random() *
        (
            pollData.percentageMax -
            pollData.percentageMin
        );


    /*
        Round to one decimal place.
    */

    const value =
        Math.round(randomValue * 10) / 10;


    /*
        Update percentage text.
    */

    percentageElement.textContent =
        value.toFixed(1) + "%";


    /*
        IMPORTANT:
        The bar uses the actual percentage.

        5% means 5% of the full bar.
    */

    barElement.style.width =
        value + "%";


    /*
        Small visual bump.
    */

    percentageElement.classList.remove("bump");

    void percentageElement.offsetWidth;

    percentageElement.classList.add("bump");
}


/* =========================================
   FIRST COMMENT
========================================= */

commentElement.textContent =
    getRandomComment();


/* =========================================
   COMMENT EVERY 3 SECONDS
========================================= */

setInterval(
    changeComment,
    3000
);


/* =========================================
   PERCENTAGE FLUCTUATION
========================================= */

setInterval(
    updatePercentage,
    550
);


/* =========================================
   INITIAL VALUE
========================================= */

updatePercentage();

</script>

</body>
</html>
