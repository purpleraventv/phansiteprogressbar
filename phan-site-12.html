<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phan-Site - 12/7 Poll</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Arsenal", Arial, Helvetica, sans-serif;

        background:
            linear-gradient(
                135deg,
                #64121e 0%,
                #9e2531 45%,
                #df704e 100%
            );
    }

    /* =====================================
       MAIN PHAN-SITE PANEL
    ===================================== */

    .phansite {
        position: relative;

        width: min(800px, 82vw);
        min-height: 280px;

        padding: 35px 35px 25px 100px;

        background: #050505;

        color: white;

        transform: rotate(-1.5deg);

        box-shadow:
            14px 14px 0 rgba(0, 0, 0, 0.28);

        z-index: 1;
    }

    .phansite::after {
        content: "";

        position: absolute;

        left: 28px;
        right: -28px;
        bottom: -22px;

        height: 30px;

        background: #050505;

        clip-path: polygon(
            0 0,
            96% 0,
            100% 100%,
            4% 100%
        );

        z-index: -1;
    }

    /* =====================================
       GIANT Q
    ===================================== */

    .q {
        position: absolute;

        left: 8px;
        top: 3px;

        font-size: 125px;
        line-height: 1;

        font-weight: 700;

        color: white;

        transform: rotate(3deg);

        z-index: 5;
    }

    /* =====================================
       PHAN-SITE TITLE
    ===================================== */

    .title {
        position: relative;

        display: inline-block;

        padding: 2px 8px 3px;

        background: #050505;

        border: 5px solid white;

        color: white;

        font-size: 40px;
        font-weight: 700;

        line-height: 1;

        letter-spacing: -3px;

        transform: rotate(-7deg);

        z-index: 4;
    }

    .title::before {
        content: "";

        position: absolute;

        left: 47%;
        top: -60px;

        width: 48px;
        height: 72px;

        background: white;

        clip-path: polygon(
            48% 0,
            100% 0,
            65% 36%,
            100% 36%,
            18% 100%,
            39% 53%,
            0 53%
        );

        z-index: -1;
    }

    /* =====================================
       QUESTION
    ===================================== */

    .question {
        margin-top: 15px;
        margin-left: 45px;

        font-size: 23px;
        font-weight: 700;

        line-height: 1.1;

        transform: rotate(-1.5deg);
    }

    .red {
        color: #ff1010;
    }

    /* =====================================
       POLL RESULT
    ===================================== */

    .result {
        display: flex;
        align-items: center;

        gap: 20px;

        margin-top: 25px;

        transform: rotate(-0.7deg);
    }

    /* =====================================
       FULL 100% POLL BAR
    ===================================== */

    .bar-container {
        position: relative;

        flex: 1;

        height: 50px;

        padding: 6px;

        background: white;

        clip-path: polygon(
            0 10%,
            100% 0,
            98% 100%,
            0 91%
        );
    }

    .bar {
        width: 0.8%;

        height: 100%;

        background: #ff0505;

        transition:
            width 0.25s cubic-bezier(.2,.8,.3,1);
    }

    /* =====================================
       YES LABEL
    ===================================== */

    .yes {
        position: absolute;

        right: -43px;
        bottom: -15px;

        font-size: 22px;
        font-weight: 700;

        color: white;

        transform: rotate(-2deg);
    }

    /* =====================================
       PERCENTAGE
    ===================================== */

    .percentage {
        width: 175px;

        font-size: 65px;

        line-height: 0.8;

        font-weight: 700;

        color: #ff0808;

        letter-spacing: -5px;

        white-space: nowrap;

        text-shadow:
            4px 4px 0 #000;

        transition:
            transform 0.12s ease-out;
    }

    .percentage.bump {
        transform:
            scale(1.035)
            rotate(-1deg);
    }

    /* =====================================
       COMMENT AREA
    ===================================== */

    .comment-container {
        position: relative;

        height: 40px;

        margin-top: 25px;
        margin-left: -8px;

        overflow: hidden;
    }

    .comment {
        position: absolute;

        left: 0;
        top: 0;

        width: 100%;

        font-size: 20px;
        font-weight: 700;

        line-height: 35px;

        white-space: nowrap;

        transform: translateY(0);

        opacity: 1;
    }

    /* =====================================
       COMMENT ANIMATIONS
    ===================================== */

    .comment.exit {
        animation:
            commentExit 0.28s ease-in forwards;
    }

    @keyframes commentExit {

        0% {
            transform: translateY(0);
            opacity: 1;
        }

        100% {
            transform: translateY(-40px);
            opacity: 0;
        }

    }

    .comment.enter {
        animation:
            commentEnter 0.28s ease-out forwards;
    }

    @keyframes commentEnter {

        0% {
            transform: translateY(40px);
            opacity: 0;
        }

        100% {
            transform: translateY(0);
            opacity: 1;
        }

    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 800px) {

        .phansite {
            width: 92vw;

            padding:
                30px
                25px
                20px
                85px;
        }

        .q {
            font-size: 105px;
        }

        .title {
            font-size: 34px;
        }

        .question {
            margin-left: 30px;
            font-size: 20px;
        }

        .percentage {
            width: 150px;
            font-size: 55px;
        }

        .yes {
            font-size: 19px;
        }

        .comment {
            font-size: 17px;
        }

    }

</style>
</head>


<body>

<div class="phansite">

    <div class="q">Q</div>

    <div class="title">
        Phan-Site
    </div>

    <div class="question">
        Do you <span class="red">support</span>
        the Phantom Thieves?
    </div>

    <div class="result">

        <div class="bar-container">

            <div
                class="bar"
                id="bar">
            </div>

            <div class="yes">
                YES
            </div>

        </div>

        <div
            class="percentage"
            id="percentage">
            0.8%
        </div>

    </div>

    <div class="comment-container">

        <div
            class="comment enter"
            id="comment">
        </div>

    </div>

</div>


<script>

/* =========================================
   POLL DATA

   Poll date: 12/7

   Question:
   Do you support the Phantom Thieves?

   Source percentage:
   Around 0.8%

   Fluctuation:
   0.7% - 0.9%
========================================= */

const pollData = {

    percentageMin: 0.7,
    percentageMax: 0.9,

    comments: [

        "Anon: a lil too late tho",
        "Anon: dat comeback looool",
        "Anon: I'd never support them",
        "Anon: I'm getting confused...",
        "Anon: I can't believe anybody...",
        "Anon: i don't really care",
        "Anon: Is Shido gonna apologize?",
        "Anon: It's happening again...",
        "Anon: just typical slander imo",
        "Anon: lol no way i'd support them",
        "Anon: may just be election shit",
        "Anon: moar like phantom GRIEF",
        "Anon: Must be tough for Shido-san",
        "Anon: My scandal sense's tingling!",
        "Anon: no one wants you thieves",
        "Anon: phantom thieves WIN PLX!!!",
        "Anon: political attack, REALLY???",
        "Anon: ppl still defend them? lmao",
        "Anon: Shido, just take the win",
        "Anon: Shouldn't Shido explain?",
        "Anon: Show yourself, Akechi!",
        "Anon: smear campaigns are gross",
        "Anon: So he didn't die...",
        "Anon: srsly, a tv hijack?",
        "Anon: Stay strong, Shido-san!",
        "Anon: stop makin such a big deal",
        "Anon: talk about election drama",
        "Anon: they're still criminals",
        "Anon: they can't take a hint",
        "Anon: this country is effed up",
        "Anon: this is a murder warning...",
        "Anon: This isn't debunked yet?",
        "Anon: this site's still up? \\:o",
        "Anon: TV hijacking is terrorism!",
        "Anon: was it the others? \\:o",
        "Anon: was that statement a lie?",
        "Anon: what about the election?",
        "Anon: what a comeback...",
        "Anon: Why isn't this on the news?",
        "Anon: wow, ppl are desperate..."

    ]

};


/* =========================================
   ELEMENTS
========================================= */

const commentElement =
    document.getElementById("comment");

const percentageElement =
    document.getElementById("percentage");

const barElement =
    document.getElementById("bar");


/* =========================================
   COMMENT STATE
========================================= */

let currentComment = -1;


/* =========================================
   RANDOM COMMENT
========================================= */

function getRandomComment() {

    let nextComment;

    do {

        nextComment =
            Math.floor(
                Math.random() *
                pollData.comments.length
            );

    } while (
        nextComment === currentComment &&
        pollData.comments.length > 1
    );

    currentComment = nextComment;

    return pollData.comments[nextComment];
}


/* =========================================
   CHANGE COMMENT
========================================= */

function changeComment() {

    commentElement.classList.remove("enter");

    commentElement.classList.add("exit");

    setTimeout(() => {

        commentElement.textContent =
            getRandomComment();

        commentElement.classList.remove("exit");

        void commentElement.offsetWidth;

        commentElement.classList.add("enter");

    }, 280);
}


/* =========================================
   UPDATE PERCENTAGE
========================================= */

function updatePercentage() {

    const randomValue =
        pollData.percentageMin +
        Math.random() *
        (
            pollData.percentageMax -
            pollData.percentageMin
        );

    const value =
        Math.round(randomValue * 10) / 10;

    percentageElement.textContent =
        value.toFixed(1) + "%";

    /*
        The bar is always calculated
        against the full 100%.
    */

    barElement.style.width =
        value + "%";

    percentageElement.classList.remove("bump");

    void percentageElement.offsetWidth;

    percentageElement.classList.add("bump");

}


/* =========================================
   FIRST COMMENT
========================================= */

commentElement.textContent =
    getRandomComment();


/* =========================================
   COMMENT ROTATION
========================================= */

setInterval(
    changeComment,
    3000
);


/* =========================================
   PERCENTAGE FLUCTUATION
========================================= */

setInterval(
    updatePercentage,
    550
);


/* =========================================
   INITIAL PERCENTAGE
========================================= */

updatePercentage();

</script>

</body>
</html>
