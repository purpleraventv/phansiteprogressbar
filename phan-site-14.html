<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&display=swap"
    rel="stylesheet"
>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phan-Site - 12/24 Poll</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Arsenal",
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #64121e 0%,
            #9e2531 45%,
            #df704e 100%
        );
}


/* =====================================
   MAIN PHAN-SITE PANEL
===================================== */

.phansite {

    position: relative;

    width: min(800px, 82vw);
    min-height: 235px;

    padding:
        35px
        35px
        25px
        100px;

    background: #050505;

    color: white;

    transform: rotate(-1.5deg);

    box-shadow:
        14px 14px 0 rgba(0, 0, 0, 0.28);

    z-index: 1;
}


.phansite::after {

    content: "";

    position: absolute;

    left: 28px;
    right: -28px;
    bottom: -22px;

    height: 30px;

    background: #050505;

    clip-path:
        polygon(
            0 0,
            96% 0,
            100% 100%,
            4% 100%
        );

    z-index: -1;
}


/* =====================================
   GIANT Q
===================================== */

.q {

    position: absolute;

    left: 8px;
    top: 3px;

    font-size: 125px;

    line-height: 1;

    font-weight: 700;

    color: white;

    transform: rotate(3deg);

    z-index: 5;
}


/* =====================================
   PHAN-SITE TITLE
===================================== */

.title {

    position: relative;

    display: inline-block;

    padding:
        2px
        8px
        3px;

    background: #050505;

    border: 5px solid white;

    color: white;

    font-size: 40px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: -3px;

    transform: rotate(-7deg);

    z-index: 4;
}


.title::before {

    content: "";

    position: absolute;

    left: 47%;
    top: -60px;

    width: 48px;
    height: 72px;

    background: white;

    clip-path:
        polygon(
            48% 0,
            100% 0,
            65% 36%,
            100% 36%,
            18% 100%,
            39% 53%,
            0 53%
        );

    z-index: -1;
}


/* =====================================
   QUESTION
===================================== */

.question {

    margin-top: 15px;
    margin-left: 45px;

    font-size: 23px;

    font-weight: 700;

    line-height: 1.1;

    transform: rotate(-1.5deg);
}


.red {
    color: #ff1010;
}


/* =====================================
   POLL RESULT
===================================== */

.result {

    display: flex;

    align-items: center;

    gap: 20px;

    margin-top: 25px;

    transform: rotate(-0.7deg);
}


/* =====================================
   POLL BAR
===================================== */

.bar-container {

    position: relative;

    flex: 1;

    height: 50px;

    padding: 6px;

    background: white;

    clip-path:
        polygon(
            0 10%,
            100% 0,
            98% 100%,
            0 91%
        );
}


.bar {

    width: 0%;

    height: 100%;

    background: #ff0505;

    transition:
        width 0.25s
        cubic-bezier(.2,.8,.3,1);
}


/* =====================================
   YES LABEL
===================================== */

.yes {

    position: absolute;

    right: -43px;
    bottom: -15px;

    font-size: 22px;

    font-weight: 700;

    color: white;

    transform: rotate(-2deg);
}


/* =====================================
   PERCENTAGE
===================================== */

.percentage {

    width: 175px;

    font-size: 65px;

    line-height: 0.8;

    font-weight: 700;

    color: #ff0808;

    letter-spacing: -5px;

    white-space: nowrap;

    text-shadow:
        4px 4px 0 #000;
}


/* =====================================
   NO COMMENT AREA
===================================== */

.no-comments {

    height: 35px;

    margin-top: 20px;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 800px) {

    .phansite {

        width: 92vw;

        padding:
            30px
            25px
            20px
            85px;
    }


    .q {
        font-size: 105px;
    }


    .title {
        font-size: 34px;
    }


    .question {

        margin-left: 30px;

        font-size: 20px;
    }


    .percentage {

        width: 150px;

        font-size: 55px;
    }


    .yes {
        font-size: 19px;
    }

}

</style>

</head>


<body>

<div class="phansite">

    <!-- Giant Q -->

    <div class="q">
        Q
    </div>


    <!-- PHAN-SITE -->

    <div class="title">
        Phan-Site
    </div>


    <!-- QUESTION -->

    <div class="question">

        Do the Phantom Thieves
        <span class="red">really exist</span>?

    </div>


    <!-- POLL RESULT -->

    <div class="result">

        <div class="bar-container">

            <div
                class="bar"
                id="bar">
            </div>

            <div class="yes">
                YES
            </div>

        </div>


        <div
            class="percentage"
            id="percentage">

            0.0%

        </div>

    </div>


    <!--
        No comment database is used for this version.
        The comment area is intentionally blank.
    -->

    <div class="no-comments"></div>

</div>


<script>

/* =========================================
   POLL DATA

   Poll date: 12/24

   Event:
   The world and Mementos merge and the
   Phantom Thieves are removed from cognition.

   Popularity:
   0.0%

   Comments:
   None
========================================= */


const pollData = {

    percentageMin: 0.0,

    percentageMax: 0.0,

    comments: []

};


/* =========================================
   ELEMENTS
========================================= */

const percentageElement =
    document.getElementById("percentage");

const barElement =
    document.getElementById("bar");


/* =========================================
   UPDATE PERCENTAGE
========================================= */

function updatePercentage() {

    /*
        The Phantom Thieves have been removed
        from the public's cognition, causing
        the popularity percentage to reach 0.0%.
    */

    const value = 0.0;


    percentageElement.textContent =
        value.toFixed(1) + "%";


    /*
        The bar represents the percentage
        out of the complete 100%.
    */

    barElement.style.width =
        value + "%";

}


/* =========================================
   INITIALISE
========================================= */

updatePercentage();

</script>

</body>
</html>
